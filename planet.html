        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.enablePan = false;
        controls.minDistance = 2; controls.maxDistance = 10;

        const geometry = new THREE.SphereGeometry(1.2, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        
        let planetMesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }));
        scene.add(planetMesh);

        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const pointLight = new THREE.PointLight(0xffffff, 1.5); pointLight.position.set(5, 3, 5); scene.add(pointLight);
        
        const starsGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i++) posArray[i] = (Math.random() - 0.5) * 20;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.005, color: 0xffffff }));
        scene.add(stars);

        // --- 3. UI and Logic Integration ---
        const navigatorList = document.getElementById('navigator-list');
        const typingBox = document.getElementById('typing-text');
        let typeInterval;

        function typeWriter(text, i=0) {
            if(i===0) { typingBox.innerHTML = ''; clearInterval(typeInterval); }
            if(i < text.length) {
                typingBox.innerHTML += text.charAt(i);
                typeInterval = setTimeout(() => typeWriter(text, i+1), 20);
            }
        }

        function loadPlanet(name) {
            const data = celestialBodies[name];
            
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${name.replace(/\s+/g, '-')}`).classList.add('active');

            
            if (planetMesh.material.map) {
                planetMesh.material.map.dispose();
            }
            planetMesh.material.dispose();

            if(data.texture) {
                planetMesh.material = new THREE.MeshStandardMaterial({
                    map: textureLoader.load(data.texture),
                    roughness: 0.6,
                    metalness: 0.1
                });
            } else {
                planetMesh.material = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.7,
                    metalness: 0.2
                });
            }

            const promptStr = `System connected to ${name}... \n\nInitiating scan...\n\n${data.desc} \n\n[Waiting for n8n Backend API connection ...]`;
            typeWriter(promptStr);
            
            gsap.fromTo(planetMesh.scale, {x:0.5, y:0.5, z:0.5}, {x:1, y:1, z:1, duration: 1.5, ease: "elastic.out(1, 0.5)"});
        }

        Object.keys(celestialBodies).forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'planet-btn';
            btn.id = `btn-${name.replace(/\s+/g, '-')}`;
            btn.innerText = name;
            btn.onclick = () => loadPlanet(name);
            navigatorList.appendChild(btn);
        });

        loadPlanet('Earth');

        async function loadUserStats() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/user_profile?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const userStats = data[0];
                        const points = userStats.points;
                        const badge = userStats.badge;

                        const displayElement = document.getElementById('user-badge-display');
                        if (displayElement) {
                            displayElement.innerText = `🚀 ${badge} (${points} Pts)`;
                        }
                    }
                } else {
                    console.warn(`Database request failed with status ${response.status}. Table may not exist or credentials are invalid.`);
                }
            } catch (error) {
                console.error("Database connection error:", error);
            }
        }

        // Page load hote hi chalega
        window.onload = function() {
            loadUserStats();

        async function askAstroAgent() {
            const inputField = document.getElementById('user-question');
            const question = inputField.value;
            
            // Agar box khali hai, toh kuch mat karo
            if (!question) return;

            
            inputField.value = '';
            typeWriter("Transmitting question to Astro-Agent...\n\n[Please wait, establishing secure connection...]");

            // ⚠️ tyrtyhfthfgjhgcfhj ⚠️
            const WEBHOOK_URL = "https://anukalppradhan777.app.n8n.cloud/webhook/master-astro-api"; 

            try {
                // Sawaal ko Webhook par bhejna
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        question: question, app_type: "planets" 
                        
                    })
                });

                if (response.ok) {
                    const responseText = await response.text();
                    
                    // Check if response body is empty
                    if (!responseText || responseText.trim() === '') {
                        typeWriter("Astro-Agent: Connected but received empty response. Check n8n webhook configuration.");
                        console.warn("Webhook returned empty response body.");
                        return;
                    }
                    
                    let aiAnswer = "Error parsing AI response.";
                    
                    // Try to parse as JSON first
                    try {
                        const data = JSON.parse(responseText);
                        
                        // ye wala section chatbox k liye hai
                        if(data && data.text) {
                             aiAnswer = data.text;
                        } else if (data && data[0] && data[0].text) {
                             aiAnswer = data[0].text; 
                        } else {
                             aiAnswer = JSON.stringify(data); // Fallback agar format alag hoga notepad wala code daalenge 
                        }
                    } catch (parseError) {
                        // If not valid JSON, treat response as plain text
                        aiAnswer = responseText;
                    }

                    // Answer ko screen par type karke dikhana
                    typeWriter("Astro-Agent: \n\n" + aiAnswer);
                } else {
                    typeWriter("Connection Failed. n8n Server might be down or URL is incorrect.");
